services:
  front:
    container_name: front
    build:
      context: .
      dockerfile: Docker/dockerfile.dev.front

    restart: unless-stopped

    networks:
      - proxy
      - portfolio-internal

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.front.rule=Host(`portfolio.localhost`)'
      - 'traefik.http.routers.front.entrypoints=websecure'
      - 'traefik.http.routers.front.tls=true'
      - 'traefik.http.services.front.loadbalancer.server.port=5173'

    volumes:
      - ./front:/app
      - /app/node_modules

  back:
    container_name: back
    build:
      context: .
      dockerfile: ./Docker/dockerfile.dev.api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://db:27017/portfolio
      FRONTEND_URL: https://portfolio.localhost
      CHOKIDAR_USEPOLLING: 'true'
    networks:
      - proxy
      - portfolio-internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.back-secure.rule=Host(`portfolio-api.localhost`)'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.back-secure.entrypoints=websecure'
      - 'traefik.http.routers.back-secure.tls=true'
      - 'traefik.http.services.back.loadbalancer.server.port=3100'

    volumes:
      - ./api:/app/
      - /app/node_modules

  db:
    container_name: db
    image: mongo:latest
    restart: unless-stopped
    networks:
      - portfolio-internal
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  letsencrypt:
networks:
  proxy:
    external: true
  portfolio-internal:
    external: false
