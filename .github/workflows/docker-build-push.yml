name: Deploy with dock
run-name: ${{ github.actor }} is 🚀 deploy website on push
on:
  push:
    branches:
      - prod
jobs:
  deploy_ssh:
    environment: SECRET
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy with server script
        run: |
          ssh -i $HOME/.ssh/id_rsa \
          -o StrictHostKeyChecking=no @{{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
           "/home/@{{ secrets.SERVER_USER }}/web/infra/deploys.sh portfolio git@github:Moxiii/vite-portefolio"
